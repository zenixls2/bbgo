---
# Live ETHJPY profile; this backtest block is retained only for explicit replay checks.
backtest:
  sessions: [binance]
  startTime: "2026-01-01"
  endTime: "2026-07-13"
  symbols: [ETHJPY]
  accounts:
    binance:
      makerFeeRate: 0.1%
      takerFeeRate: 0.1%
      balances:
        JPY: 1000000
        ETH: 0

sessions:
  binance:
    exchange: binance
    envVarPrefix: BINANCE

# Persist the complete private order lifecycle and fills in SQLite. Restrict
# listeners to the only session and symbol used by this service.
sync:
  # Live persistence must not trigger a REST history scan on every strategy
  # restart; backfills remain available through the explicit `bbgo sync` job.
  disableStartupSync: true
  userDataStream:
    trades: true
    orders: true
  sessions:
    - binance
  symbols:
    - session: binance
      symbol: ETHJPY

# Persist fee-adjusted position cost and reset cooldowns across service restarts.
persistence:
  json:
    directory: data/gammacapture/state

notifications:
  telegram:
    broadcast: true
  switches:
    trade: true
    orderUpdate: true
    submitOrder: true
    position: true

exchangeStrategies:
  - on: binance
    gammacapture:
      environment: live
      symbol: ETHJPY
      interval: 1m
      symbolSelection:
        mode: allowlist
        quoteAsset: JPY
        symbols: [ETHJPY]
      barrier:
        # Log return barrier: 10 bps. It stays fixed for the epoch.
        width: 0.001
        epochDuration: 30m
        updateOnlyWhenFlat: true
        # A sparse/reconnected observation cannot reveal the path through
        # multiple barriers; reset rather than invent a chronological sequence.
        maxCrossingsPerEvent: 1
      intensity:
        # Six hours captures the active local regime; minEvents=10 means
        # HEALTHY requires 20 clean crossings in that rolling window.
        # Live startup replays the local Binance BBO capture; a longer causal
        # window avoids starting DEGRADED when a shorter interval is quiet.
        window: 6h
        priorAlphaUp: 1
        priorBetaUp: 60
        priorAlphaDown: 1
        priorBetaDown: 60
        minEvents: 10
      horizon:
        # Directional/replay horizon; maker quote lifetimes are configured
        # independently under marketMaker.min/maxTradingWindow.
        prediction: 15m
        maximumHolding: 30m
      referencePrice:
        # Directional crossings use microprice when BBO is available. Maker
        # execution-risk estimators separately use ask returns for BUY and bid
        # returns for SELL.
        mode: microprice
      signal:
        lowerThreshold: 0.40
        upperThreshold: 0.60
        entryProbability: 0.62
        exitProbability: 0.42
        maxChurn: 4
        # Permit a settled confirmation candle after a completed upcrossing.
        entryConfirmationWindow: 5m
        # A stretched upcrossing must pull back before it can be confirmed.
        stretchedSignalRetraceBps: 10
      takeProfit:
        activationBarriers: 4
        initialTargetBarriers: 6
        minTrailingBarriers: 1
        maxTrailingBarriers: 4
      stopLoss:
        hardStopBarriers: 3
        softStopBarriers: 2
      # The maker does not load a frozen/pre-trained model. Startup instead
      # replays the local Binance BBO/trade capture through the same causal
      # online learners, then continues from the exchange stream.
      aggTradeWarmup:
        enabled: false
        path: data/gammacapture
        livePath: data/gammacapture/live
        # These paths are also the local collector roots used by the BBO/trade
        # startup replay even though legacy aggregate-trade warmup is disabled.
      # Fee-aware maker quote path. Start with a small notional while live BBO,
      # queue-position, and fill-reconciliation behavior is being validated.
      marketMaker:
        enabled: true
        # Cancel maker orders left by an earlier gammacapture process before
        # opening a new quote window. Binance UI orders are not selected.
        startupCancelStaleOrders: true
        # Refresh authenticated balances so external JPY/base changes are
        # reflected in position sizing without restarting BBGO.
        accountSyncInterval: 60s
        # Conservative fee floors: authenticated session/account rates may
        # raise these values, but cannot lower the configured budget.
        makerFeeBps: 10
        takerFeeBps: 10
        minimumNetEdgeBps: 2
        adverseSelectionBps: 2
        minimumHalfSpreadBps: 15
        maximumHalfSpreadBps: 80
        volatilityMultiplier: 0.75
        inventoryTarget: 0
        inventoryLimit: 0.02 # fallback only when autoInventoryLimit is false
        autoInventoryLimit: true
        # Dynamic risk budget: 10 JPY is the absolute floor; larger accounts
        # use 0.25% of current ETHJPY quote-equivalent equity. Quote notional
        # is calculated from realized volatility and crossing load; it is not
        # clamped to a fixed JPY minimum/maximum.
        inventoryRiskBudgetJPY: 10
        inventoryRiskBudgetRatio: 0.0025
        inventoryRiskZScore: 1.282
        # Center Fast quantity on the posterior expectation between the
        # persisted session base anchor and the 50% policy target. Falling
        # prices no longer create an unconditional constant-mix BUY demand.
        posteriorInventoryTarget: true
        # Same-symbol 45-second executable-BBO direction auxiliary. Its raw
        # BOCPD probability is mapped by rolling Platt calibration only after
        # each future label matures; no offline artifact or future label is
        # available to the current prediction.
        bocpd45:
          enabled: true
          calibration: platt
          horizon: 45s
          calibrationWindow: 6h
          minimumChanges: 8
          minimumSamples: 32
          maximumStates: 128
          refitEvery: 8
          priorStrength: 8
        probabilityCenteredQuantity:
          enabled: true
          # Live canary enabled after paired-replay review; retain quantityProjection diagnostics.
          shadowOnly: false
        # Jointly choose one outward Fast price level and both executable
        # quantities. Candidate levels are mutually exclusive alternatives,
        # not simultaneous ladder orders. Completed-window touch probabilities
        # and their paired covariance drive the inventory chance constraint;
        # the old soft-band/6 fixed tranche cap is not applied a second time.
        jointDistanceQuantity:
          enabled: true
          # Fast has sole ownership of final quantity. The one-sided terminal-return
          # posterior uses fractional Kelly inside live risk/headroom/balance
          # capacity. For a non-positive marginal BUY, the selected-window Beta
          # posterior advantage scales only the target-acquisition cells above the
          # exchange minimum; a bearish terminal path still caps BUY at one cell.
          # This avoids both unconditional multi-cell averaging-down and the former
          # duplicate one-cell penalty that suppressed bullish acquisition. No Macro
          # or downstream profitability overlay resizes this result. Thirteen points
          # are numerical resolution, not simultaneous orders.
          shadowOnly: false
          candidateCount: 13
        # After a private fill, compare inward opposite-side prices against the
        # ordinary quote on paired completed BBO paths. The model may spend
        # cycle edge during a statistically supported continuation or risk
        # reduction; the previous fill price is never a hard gate.
        postFillUtility:
          enabled: true
          minimumSamples: 6
          confidenceZScore: 1.645
          candidateCount: 8 # numerical price-grid resolution; not an inventory-risk weight

        # Portfolio policy bounds: 50% ETH / 50% JPY is the strategic prior,
        # while 0% and 100% are hard outer limits. Fast alone derives price,
        # quantity, expected 50/50 correction, and whole-position risk within
        # these limits; remaining balance/inventory headroom is authoritative.
        inventoryTargetRatio: 0.5 # fallback when pair-equity balances are unavailable
        inventoryCapitalMinRatio: 0.0
        inventoryCapitalTargetRatio: 0.50
        inventoryCapitalMaxRatio: 1.0
        # Retained below only for backward-compatible YAML decoding and offline
        # research. The live Macro target, no-trade rebalancer, reversal lease,
        # and IOC actuator are disabled; they cannot alter Fast inventory bands.
        macroInventory:
          enabled: false
          noTradeRegion:
            enabled: true
            # Keep the latent Merton/no-trade aim independent from current
            # holdings. Risk-reducing SELL adjustments are costed by the
            # no-trade boundary itself; hold protection remains one-sided on
            # uncertain inventory increases.
            downsideRiskControlEnabled: true
            # If enabled, Macro may leave the hold inventory only when the
            # one-sided executable forecast lower bound clears round-trip cost.
            # With downside risk control this applies to increases only.
            holdProtectionEnabled: true
            holdProtectionZScore: 1.645
            holdProtectionMinEdgeBps: 0
            # Research-only: the causal long-window pivot model improved
            # drawdown but did not yet deliver early strong entry after fees.
            trendExcursionEnabled: false
            # The legacy one-sided continuation cap remains disabled. The
            # complete same-ticker continuation posterior owns the single Macro
            # target when healthy; QV crossing is its causal fallback.
            continuationEnabled: false
            continuationMixtureEnabled: true
          barInterval: 10m
          lookback: 240h
          riskHorizons: [3h, 6h, 24h]
          minimumSamples: 8
          riskAversion: 1.0
          priorStrength: 0.05
          driftPriorSamples: 20
          downsideZScore: 2.326347874
          carryRiskBudgetRatio: 0.01
          maxWealthDrawdownRatio: 0.05
          reversalAccumulation:
            # Decode-compatible fallback used only when noTradeRegion is off.
            enabled: true
            # A fixed-endpoint sequential test compares the newest two closed
            # executable-price bars with at least six preceding bars. This
            # reduces detection from four posterior bars to two (normally
            # 10-20 minutes depending on bar alignment). Its target shift is
            # automatically shrunk by posterior sample reliability; the full
            # BIC change-point path remains responsible for confirmed sizing.
            earlyDetection: true
            earlyPosteriorBars: 2
            earlyMinimumPriorBars: 6
            # When noTradeRegion is off, a marketable LIMIT IOC is allowed at
            # most once per new closed
            # Macro bar. It compares a BBO maker benchmark over the selected
            # Fast 10/15/30-minute window against confidence-adjusted waiting
            # loss. The IOC is a probability-sized tactical tranche capped by
            # free balance, exchange filters, and opposite-side BBO depth. Its
            # remaining economic surplus bounds the worst executable price.
            # Resting maker orders stay live unless the IOC actually fills.
            activeExecution:
              enabled: false
        # The joint quote policy derives reservation price, spread, and side
        # quantity from the same normalized evidence and hazard inputs. Legacy
        # coefficient keys are intentionally omitted from the live profile.
        # Reference value used only for risk-budget defaults and inventory-band
        # initialization. Actual order size is statistical and account-bound.
        quoteNotionalJPY: 120
        # ETHJPY is thin; preserve queue age through the modeled keep window.
        # Ordinary price/imbalance changes remain diagnostic until expiry.
        refreshInterval: 60s
        minRefreshInterval: 20s
        maxRefreshInterval: 30m
        # The order-keep model maps the distance/volatility first-passage time
        # upward to a measured horizon. Ten minutes is the statistical floor;
        # 10m, 15m, and 30m are independently health- and arrival-gated.
        minTradingWindow: 10m
        maxTradingWindow: 30m
        horizonLookback: 6h
        horizonUpdateInterval: 1m
        # Effective exposure is overlap-adjusted. Posterior uncertainty,
        # rather than non-zero touches on both sides, gates realignment.
        horizonMinSamples: 6
        # Arrival optimization is intentionally removed from this profile;
        # Macro uses the existing horizon/crossing model without an online
        # distance learner or startup BBO replay.
        refreshMoveBps: 8
        # Reprice a side that has moved materially away from the current BBO
        # only after its modeled keep window; this is directional, not a
        # BBO-tick cancel loop. Crossed/missing-side recovery remains faster.
        adverseRepriceBps: 20
        # Maintain all candidate crossing, public-evidence, and direction models
        # continuously. Select the HEALTHY horizon with maximum fee-net crossing
        # edge per hour using that horizon's own executable-side volatility, then
        # align Fast direction to the same window. Health-ranked fallback applies
        # only when the expected-value-selected window is not admissible.
        fastWindows: [10m, 15m, 30m]
        # Observational raw trade/BBO coverage thresholds. These do not
        # override crossing health or prove fee-adjusted profitability.
        fastEvidenceMinTrades: 20
        fastEvidenceMinBBOUpdates: 20
        # Public-flow agreement is an auxiliary input for ETHJPY. A conflict
        # suppresses only the volume component; inventory/direction gates remain.
        ofiVolumeAgreement:
          enabled: true
          minOFI: 0.10
          minVolume: 0.10
          suppressOnDisagreement: true
        acquisitionQuote:
          # Shadow-only first-passage accommodation; it reports a dynamic
          # confidence-bounded bid delta without changing live orders.
          enabled: true
          shadowOnly: true
          maxDeltaBps: 15
          minDriftBps: 2
          driftConfidenceZScore: 1.645
          minDirection: 0.25
        inventoryReset:
          enabled: true
          maxAskAge: 3m
          fastAskAge: 1m
          adverseMoveBps: 40
          fastAdverseMoveBps: 20
          fastDirectionThreshold: 0.25
          maxSlippageBps: 25
          # Fallback only; live reset orders reuse the same risk-sized ticket
          # as the passive quote when the dynamic band is available.
          reductionNotionalJPY: 120
          cooldown: 15m
          # AggTrade archives do not expose queue position; haircut the
          # crossing intensity before estimating passive fill probability.
          fillIntensityHaircut: 0.25
          riskZScore: 1.645
          # The chronological fair-price holdout retained mid as a martingale
          # baseline. Do not extrapolate the just-observed decline into another
          # identical decline without new out-of-sample evidence.
          driftContinuationWeight: 0
          # Reset is an accelerated profitable exit, not an unvalidated stop.
          # Average cost already includes the base-denominated buy fee; this
          # threshold additionally includes the future taker fee.
          minimumRoundTripValueBps: 2
          minimumImprovementBps: 2

        acquisitionReset:
          # Research implementation is present but the Jul-28 chronological
          # holdout produced no statistically eligible IOC event. Keep live
          # promotion fail-closed until a qualifying out-of-sample sample exists.
          enabled: false
          # The fee-aware label study found 68 non-overlapping 10-minute
          # opportunities above the full 29-bps cost/edge threshold. Observe
          # the selected causal start pattern in logs, but do not authorize an
          # IOC until additional shadow outcomes narrow its holdout interval.
          shadowStartEnabled: true
          # Live return thresholds are generated from executable ask variance.
          # These fixed BPS fallbacks remain zero so missing calibration fails
          # closed instead of silently reverting to an old market regime.
          startReturn1mMinBps: 0
          startReturn5mMinBps: 0
          startReturnTailProbability: 0.10
          startMinimumTrades5m: 10
          # A positive endpoint alone is not a confirmed breakout. Estimate
          # five-minute ask variance from one-second BBO samples and use
          # the Brownian maximum-drawdown quantile implied by a 10% tail. This
          # produces a live BPS limit instead of a fixed, uncalibrated number.
          startMinimumBBO5m: 20
          startMinimumVolatilitySamples5m: 20
          startDrawdownTailProbability: 0.10
          startMaxDrawdown5mBps: 0
          # Never chase a transient BBO move. Inventory must remain below its
          # dynamic target for a full window; ordinary bid repricing does not
          # reset this causal deficit clock.
          minDeficitAge: 10m
          # The live adverse-move gate is the same five-minute upper-tail move
          # generated from executable ask variance; zero disables the legacy BPS
          # fallback so unavailable calibration fails closed.
          adverseMoveBps: 0
          maxSlippageBps: 5
          cooldown: 30m
          # Samples are quote-distance crossings from the selected horizon,
          # not the directional 10-bps barrier or raw BBO update count.
          minSamples: 30
          # One-sided 95% Wilson lower bound must still put upward crossing
          # probability above 50% before an IOC BUY is even valued.
          confidenceZScore: 1.645
          # Public touches are not private fills; preserve the same 25%
          # conversion haircut used by the maker fill model.
          fillIntensityHaircut: 0.25
          riskZScore: 1.645
          # Both the IOC's confidence-bounded expected value and its advantage
          # over continuing to wait must remain positive after 10-bps taker,
          # 10-bps future maker, slippage, and adverse-selection allowances.
          minimumExpectedValueBps: 2
          minimumImprovementBps: 2

        earlyBump:
          # The original Jul-23..29 study used a five-minute drawdown. Live
          # shadow detection now measures drawdown over the adaptive selected
          # 10/15/30-minute evidence window so a slow decline cannot lose its
          # causal high before the 30-second rebound confirms. The old 21/45
          # versus 45/255 Wilson counts remain development evidence only; the
          # selected-window trigger stays shadow-only until new per-window
          # outcomes are calibrated out of sample.
          enabled: true
          shadowOnly: true
          minimumDrawdownBps: 15
          minimumRebound30sBps: 7
          exitRebound30sBps: 3.5
          # The missed Jul-29 low was 6.7 bps above the resting bid. The
          # discrete research grid therefore selects +7 bps; it remains capped
          # at best bid and can never cross the ask.
          selectedDeltaBps: 7
          activationSuccesses: 21
          activationSamples: 45
          baselineSuccesses: 45
          baselineSamples: 255
          minimumSamples: 30
          confidenceZScore: 1.959963984540054
          minimumProbabilityLift: 0
          minimumBBO: 20
          lockDuration: 30s
          cooldown: 2m
      risk:
        maxRiskPerTradeJPY: 1000
        maxSymbolNotionalJPY: 50000
        # Enforced in paper mode when lastTrade is selected; candle replay has
        # no historical BBO stream and reports this gate as not applicable.
        maxSpreadBps: 10
        maxBookAge: 5s
        # 20 bps fee budget (0.1% per taker side) + 10 bps spread/slippage.
        estimatedCostBps: 30
        # Require an additional 15 bps model edge after all costs.
        minimumNetEdgeBps: 15
        # Avoid buying a spike close in a one-minute candle replay.
        maxEntryBarRangeBps: 25
        maxEntryBarReturnBps: 15
        softExitMinHolding: 5m
        cooldownAfterStop: 30m
