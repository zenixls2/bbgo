# Fee-inclusive candidate search with an explicit minimum activity constraint.
# Candidates with fewer than 60 completed round turns in the five-month
# training replay cannot win over a trade-producing candidate.
algorithm: tpe
objectiveBy: equityWithTurnover
minimumRoundTurns: 60
maxEvaluation: 8

executor:
  type: local
  local:
    maxNumberOfProcesses: 4

matrix:
  - type: rangeInt
    label: initial_target_barriers
    path: /exchangeStrategies/0/gammacapture/takeProfit/initialTargetBarriers
    min: 5
    max: 9
    step: 1

  - type: rangeFloat
    label: entry_probability
    path: /exchangeStrategies/0/gammacapture/signal/entryProbability
    min: 0.56
    max: 0.66
    step: 0.02

  - type: rangeFloat
    label: minimum_net_edge_bps
    path: /exchangeStrategies/0/gammacapture/risk/minimumNetEdgeBps
    min: 0
    max: 20
    step: 5
