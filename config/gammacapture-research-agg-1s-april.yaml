---
# Research only: one-second trade-derived bars around the April impulse loss.
backtest:
  sessions: [binance]
  startTime: "2026-04-16"
  endTime: "2026-04-20"
  syncSecKLines: true
  symbols: [BTCJPY]
  csvConfig: {path: data/gammacapture, market: spot, granularity: aggTrades}
  accounts:
    binance:
      makerFeeRate: 0.1%
      takerFeeRate: 0.1%
      balances: {JPY: 1000000, BTC: 0}
sessions:
  binance: {exchange: binance}
exchangeStrategies:
  - on: binance
    gammacapture:
      environment: replay
      symbol: BTCJPY
      interval: 1s
      symbolSelection: {mode: allowlist, quoteAsset: JPY, symbols: [BTCJPY]}
      barrier: {width: 0.001, epochDuration: 30m, updateOnlyWhenFlat: true, maxCrossingsPerEvent: 8}
      intensity: {window: 2h, priorAlphaUp: 1, priorBetaUp: 60, priorAlphaDown: 1, priorBetaDown: 60, minEvents: 10}
      horizon: {prediction: 30m, maximumHolding: 45m}
      signal: {lowerThreshold: 0.40, upperThreshold: 0.60, entryProbability: 0.62, exitProbability: 0.42, maxChurn: 4, entryConfirmationWindow: 5m, stretchedSignalRetraceBps: 0}
      takeProfit: {activationBarriers: 4, initialTargetBarriers: 6, minTrailingBarriers: 1, maxTrailingBarriers: 4}
      stopLoss: {hardStopBarriers: 3, softStopBarriers: 2}
      risk: {maxRiskPerTradeJPY: 1000, maxSymbolNotionalJPY: 50000, estimatedCostBps: 25, minimumNetEdgeBps: 15, maxEntryBarRangeBps: 25, maxEntryBarReturnBps: 15, softExitMinHolding: 5m, cooldownAfterStop: 30m}
