---
# Research-only train period.  A 25-bps grid keeps a one-minute close from
# representing more than one eligible crossing, while preserving a usable
# event sample for calibration.
backtest:
  sessions: [binance]
  startTime: "2026-01-01"
  endTime: "2026-06-01"
  symbols: [BTCJPY]
  accounts:
    binance:
      makerFeeRate: 0.1%
      takerFeeRate: 0.1%
      balances: {JPY: 1000000, BTC: 0}
sessions:
  binance: {exchange: binance, envVarPrefix: BINANCE}
exchangeStrategies:
  - on: binance
    gammacapture:
      environment: backtest
      symbol: BTCJPY
      interval: 1m
      symbolSelection: {mode: allowlist, quoteAsset: JPY, symbols: [BTCJPY]}
      barrier: {width: 0.0025, epochDuration: 30m, updateOnlyWhenFlat: true, maxCrossingsPerEvent: 1}
      intensity: {window: 4h, priorAlphaUp: 1, priorBetaUp: 60, priorAlphaDown: 1, priorBetaDown: 60, minEvents: 8}
      horizon: {prediction: 30m, maximumHolding: 45m}
      signal: {lowerThreshold: 0.40, upperThreshold: 0.60, entryProbability: 0.62, exitProbability: 0.42, maxChurn: 4, entryConfirmationWindow: 5m, stretchedSignalRetraceBps: 10}
      takeProfit: {activationBarriers: 3, initialTargetBarriers: 4, minTrailingBarriers: 1, maxTrailingBarriers: 3}
      stopLoss: {hardStopBarriers: 2, softStopBarriers: 1}
      risk: {maxRiskPerTradeJPY: 1000, maxSymbolNotionalJPY: 50000, estimatedCostBps: 25, minimumNetEdgeBps: 15, maxEntryBarRangeBps: 30, maxEntryBarReturnBps: 18, softExitMinHolding: 5m, cooldownAfterStop: 30m}
