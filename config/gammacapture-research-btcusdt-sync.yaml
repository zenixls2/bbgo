---
# Data-only cross-market reference sync. The deliberately unreachable edge
# threshold prevents research trades while BBGO populates BTCUSDT klines.
backtest:
  sessions: [binance]
  startTime: "2025-07-01"
  endTime: "2026-07-13"
  symbols: [BTCUSDT]
  accounts:
    binance:
      makerFeeRate: 0.1%
      takerFeeRate: 0.1%
      balances: {USDT: 1000, BTC: 0}
sessions:
  binance: {exchange: binance, envVarPrefix: BINANCE}
exchangeStrategies:
  - on: binance
    gammacapture:
      environment: backtest
      symbol: BTCUSDT
      interval: 1m
      symbolSelection: {mode: allowlist, quoteAsset: USDT, symbols: [BTCUSDT]}
      barrier: {width: 0.001, epochDuration: 30m, updateOnlyWhenFlat: true, maxCrossingsPerEvent: 1}
      intensity: {window: 2h, priorAlphaUp: 1, priorBetaUp: 60, priorAlphaDown: 1, priorBetaDown: 60, minEvents: 10}
      horizon: {prediction: 2h, maximumHolding: 3h}
      signal: {lowerThreshold: 0.42, upperThreshold: 0.58, entryProbability: 0.60, exitProbability: 0.45, maxChurn: 4, entryConfirmationWindow: 5m, stretchedSignalRetraceBps: 10}
      takeProfit: {activationBarriers: 6, initialTargetBarriers: 8, minTrailingBarriers: 1, maxTrailingBarriers: 4}
      stopLoss: {hardStopBarriers: 2, softStopBarriers: 1}
      risk: {maxRiskPerTradeJPY: 1, maxSymbolNotionalJPY: 1, estimatedCostBps: 25, minimumNetEdgeBps: 999999, maxEntryBarRangeBps: 25, maxEntryBarReturnBps: 15, softExitMinHolding: 10m, cooldownAfterStop: 30m}
