---
# Research candidate only: minimal relaxation of the observed 11.47-bps maximum
# expectancy. Jan-May is the parameter-selection period, not performance proof.
backtest:
  sessions: [binance]
  startTime: "2026-01-01"
  endTime: "2026-06-01"
  symbols: [BTCJPY]
  accounts:
    binance:
      makerFeeRate: 0.1%
      takerFeeRate: 0.1%
      balances: {JPY: 1000000, BTC: 0}

sessions:
  binance: {exchange: binance, envVarPrefix: BINANCE}

exchangeStrategies:
  - on: binance
    gammacapture:
      environment: backtest
      symbol: BTCJPY
      interval: 1m
      symbolSelection: {mode: allowlist, quoteAsset: JPY, symbols: [BTCJPY]}
      barrier: {width: 0.001, epochDuration: 30m, updateOnlyWhenFlat: true, maxCrossingsPerEvent: 8}
      intensity: {window: 2h, priorAlphaUp: 1, priorBetaUp: 60, priorAlphaDown: 1, priorBetaDown: 60, minEvents: 10}
      horizon: {prediction: 15m, maximumHolding: 30m}
      signal: {lowerThreshold: 0.40, upperThreshold: 0.60, entryProbability: 0.62, exitProbability: 0.42, maxChurn: 4}
      takeProfit: {activationBarriers: 4, initialTargetBarriers: 6, minTrailingBarriers: 1, maxTrailingBarriers: 4}
      stopLoss: {hardStopBarriers: 3, softStopBarriers: 2}
      risk: {maxRiskPerTradeJPY: 1000, maxSymbolNotionalJPY: 50000, estimatedCostBps: 25, minimumNetEdgeBps: 10, softExitMinHolding: 5m, cooldownAfterStop: 30m}
