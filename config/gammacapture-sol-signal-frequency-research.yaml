---
# Research-only SOLJPY replay. It aligns the hysteresis high threshold with
# entryProbability to test signal frequency without weakening fee-aware EV.
backtest:
  sessions: [binance]
  startTime: "2026-01-01"
  endTime: "2026-07-13"
  symbols: [SOLJPY]
  accounts:
    binance:
      makerFeeRate: 0.1%
      takerFeeRate: 0.1%
      balances: {JPY: 1000000, SOL: 0}

sessions:
  binance: {exchange: binance, envVarPrefix: BINANCE}

exchangeStrategies:
  - on: binance
    gammacapture:
      environment: backtest
      symbol: SOLJPY
      interval: 1m
      symbolSelection: {mode: allowlist, quoteAsset: JPY, symbols: [SOLJPY]}
      barrier: {width: 0.001, epochDuration: 30m, updateOnlyWhenFlat: true, maxCrossingsPerEvent: 1}
      intensity: {window: 2h, priorAlphaUp: 1, priorBetaUp: 60, priorAlphaDown: 1, priorBetaDown: 60, minEvents: 10}
      horizon: {prediction: 15m, maximumHolding: 30m}
      referencePrice: {mode: klineClose}
      signal: {lowerThreshold: 0.40, upperThreshold: 0.50, entryProbability: 0.50, exitProbability: 0.35, maxChurn: 4, entryConfirmationWindow: 5m, stretchedSignalRetraceBps: 10}
      takeProfit: {activationBarriers: 4, initialTargetBarriers: 6, minTrailingBarriers: 1, maxTrailingBarriers: 4}
      stopLoss: {hardStopBarriers: 3, softStopBarriers: 2}
      risk: {maxRiskPerTradeJPY: 1000, maxSymbolNotionalJPY: 50000, estimatedCostBps: 25, minimumNetEdgeBps: 15, maxEntryBarRangeBps: 25, maxEntryBarReturnBps: 15, softExitMinHolding: 5m, cooldownAfterStop: 30m}
